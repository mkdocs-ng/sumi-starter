# yaml-language-server: $schema=https://mkdocs-ng.org/schema.json
#
# One file for both languages: English at the root of the site, Chinese at /zh/.
# Change these first: site_name, site_description, site_url, repo_url, and the
# same keys under languages.zh.

site_name: My Project
site_description: One sentence that says what My Project does and who it is for.
site_url: https://example.github.io/my-project/
repo_url: https://github.com/example/my-project
repo_name: example/my-project
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 My Project contributors

theme:
  name: sumi
  locale: en
  accent: vermilion        # indigo, moss, plum, ochre, teal, ink, or any CSS colour
  # logo: assets/logo.svg  # an image in docs/; the Sumi mark is used until you set one
  # social_image: assets/social.png   # share preview image in docs/

# The first language is the default. Each other one is built into /<code>/ and
# can override any setting above. Chinese pages live in docs-zh/, with the same
# paths as docs/; a page without a translation is shown in English with a note.
languages:
  en: English
  zh:
    name: 简体中文
    site_name: 我的项目
    site_description: 用一句话说明这个项目做什么、给谁用。
    docs_dir: docs-zh
    edit_uri: edit/main/docs-zh/
    nav:
      - 首页: index.md
      - 指南:
        - guide/index.md
        - 安装: guide/install.md
        - 快速开始: guide/quick-start.md
        - 编写文档: guide/writing.md
      - 参考:
        - 配置: reference/configuration.md
      - 版本发布: releases.md
      - 博客: blog/index.md

plugins:
  - search
  - llms_txt:              # llms.txt plus a Markdown copy of every page, for AI agents
      full_output: true
  - sumi:
      git_dates: true      # "last updated" from Git history
      # blog:
      #   layout: cards    # card view for the blog index

extra:
  social:
    - {icon: brand-github, link: "https://github.com/example/my-project", name: GitHub}

nav:
  - Home: index.md
  - Guide:
    - guide/index.md
    - Install: guide/install.md
    - Quick start: guide/quick-start.md
    - Writing docs: guide/writing.md
  - Reference:
    - Configuration: reference/configuration.md
  - Releases: releases.md
  - Blog: blog/index.md
