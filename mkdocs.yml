# yaml-language-server: $schema=https://mkdocs-ng.org/schema.json
#
# One file for both languages: English at the root of the site, Chinese at /zh/.
# Change these first: site_name, site_description, site_url, repo_url, and the
# same keys under languages.zh.

site_name: My Project
site_description: One sentence that says what My Project does and who it is for.
site_url: https://example.github.io/my-project/
repo_url: https://github.com/example/my-project
repo_name: example/my-project
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 My Project contributors

theme:
  name: sumi
  locale: en
  accent: vermilion        # indigo, moss, plum, ochre, teal, ink, or any CSS colour
  # logo: assets/logo.svg  # an image in docs/; the Sumi mark is used until you set one
  # social_image: assets/social.png   # share preview image, about 1200x630

  # Optional features. Uncomment a whole block when you are ready to use it.
  # Every theme option: https://sumi.mkdocs-ng.org/docs/customize/theme/
  #
  # announcement: 'My Project 1.0 is out. <a href="https://example.github.io/my-project/blog/">Read the post</a>'
  #
  # comments:              # Giscus, backed by GitHub Discussions; ids from giscus.app
  #   provider: giscus     # https://sumi.mkdocs-ng.org/docs/run/comments/
  #   repo: example/my-project
  #   repo_id: R_kgDOxxxxxx
  #   category: Announcements
  #   category_id: DIC_kwDOxxxxxx
  #
  # feedback: true         # "Was this page helpful?", sent to extra.analytics
  #
  # footer_links:          # columns of links above the footer
  #   - title: Project     # links are site paths (releases/) or full URLs
  #     links:
  #       - {text: Releases, link: releases/}
  #       - {text: Source, link: "https://github.com/example/my-project"}
  #
  # version_provider: mike # version menu from mike's versions.json
  #                        # https://sumi.mkdocs-ng.org/docs/customize/navigation/

# The first language is the default. Each other one is built into /<code>/ and
# can override any setting above. Chinese pages live in docs-zh/, with the same
# paths as docs/; a page without a translation is shown in English with a note.
languages:
  en: English
  zh:
    name: 简体中文
    site_name: 我的项目
    site_description: 用一句话说明这个项目做什么、给谁用。
    docs_dir: docs-zh
    edit_uri: edit/main/docs-zh/
    nav:
      - 首页: index.md
      - 指南:
        - guide/index.md
        - 安装: guide/install.md
        - 快速开始: guide/quick-start.md
        - 编写文档: guide/writing.md
      - 参考:
        - 配置: reference/configuration.md
      - 版本发布: releases.md
      - 博客: blog/index.md

plugins:
  - search
  - llms_txt:              # llms.txt plus a Markdown copy of every page, for AI agents
      full_output: true
  - sumi:
      git_dates: true      # "last updated" from Git history
      # assistant_links: [claude, chatgpt]   # "Open in Claude/ChatGPT" in the page menu
      blog:
        layout: cards      # or: list

extra:
  social:
    - {icon: brand-github, link: "https://github.com/example/my-project", name: GitHub}
  # analytics:             # Plausible, Umami or Google Analytics (provider: google)
  #   provider: plausible  # https://sumi.mkdocs-ng.org/docs/run/analytics/
  #   domain: example.github.io

nav:
  - Home: index.md
  - Guide:
    - guide/index.md
    - Install: guide/install.md
    - Quick start: guide/quick-start.md
    - Writing docs: guide/writing.md
  - Reference:
    - Configuration: reference/configuration.md
  - Releases: releases.md
  - Blog: blog/index.md
